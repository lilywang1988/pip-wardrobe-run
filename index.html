<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws Run</title>
<style>
  :root { --ink:#f3efe6; --panel:#1d2233; --panel2:#272d44; --accent:#ffc53d; --line:#3a4160; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#12151f; color:var(--ink);
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas#game { width:100%; height:100%; display:block; background:#000; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .hudBtn { position:absolute; top:2%; padding:.35em .8em; border-radius:999px;
    border:2px solid rgba(255,255,255,.7); background:rgba(0,0,0,.35); font-weight:700; font-size:clamp(11px,1.6vw,15px); }
  #pauseBtn { right:1.5%; }
  #touch { position:absolute; inset:auto 0 3% 0; display:none; justify-content:space-between; padding:0 3%; pointer-events:none; }
  #touch div { display:flex; gap:12px; }
  #touch button { pointer-events:auto; width:64px; height:64px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
    background:rgba(0,0,0,.35); font-size:15px; font-weight:800; user-select:none; -webkit-user-select:none; touch-action:none; }
  @media (pointer:coarse) { #touch { display:flex; } }

  .overlay { position:fixed; inset:0; display:none; overflow:auto; padding:16px; background:rgba(10,12,20,.82); z-index:5; }
  .overlay.on { display:flex; }
  .card { margin:auto; width:min(800px,100%); background:var(--panel); border:2px solid var(--line);
    border-radius:18px; padding:18px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { margin:0 0 2px; font-size:clamp(24px,4.5vw,34px); letter-spacing:.5px; color:var(--accent); }
  .sub { margin:0 0 12px; opacity:.8; font-size:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; margin:12px 0 8px; opacity:.75; }
  .ward { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .pv { flex:none; display:flex; flex-direction:column; gap:8px; }
  #preview { width:170px; height:140px; border-radius:14px; background:var(--panel2); border:2px solid var(--line); }
  .opts { flex:1; min-width:260px; }
  .row { display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
  .row > span { width:58px; font-size:13px; opacity:.85; }
  .row > div { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .sw { width:23px; height:23px; border-radius:50%; border:2px solid rgba(255,255,255,.15); padding:0; }
  .sw.sel { border-color:#fff; box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .chip { padding:.3em .8em; border-radius:999px; border:2px solid var(--line); background:var(--panel2); font-size:13px; }
  .chip.sel { border-color:var(--accent); color:var(--accent); }
  .envs { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .env { height:46px; border-radius:12px; border:3px solid transparent; font-weight:800; font-size:13px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px; text-shadow:0 1px 3px rgba(0,0,0,.7); color:#fff; }
  .env.sel { border-color:var(--accent); }
  .levels { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .big { padding:.7em .5em; border-radius:12px; border:0; background:var(--accent); color:#1b1400; font-weight:800; font-size:16px; }
  .big small { display:block; font-weight:600; font-size:11px; opacity:.75; }
  .big:disabled { background:var(--panel2); color:#8088a5; cursor:not-allowed; }
  .big.ghost { background:var(--panel2); color:var(--ink); border:2px solid var(--line); }
  .help { margin:12px 0 0; font-size:12.5px; opacity:.72; line-height:1.5; }
  #solar { width:100%; display:block; border-radius:14px; border:2px solid var(--line); cursor:pointer; background:#05071a; touch-action:manipulation; }
  #msg .card { width:min(420px,100%); text-align:center; }
  #msg p { margin:6px 0 16px; opacity:.85; }
  #msg .levels { grid-template-columns:1fr 1fr; }
  
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <button id="pauseBtn" class="hudBtn">Dress up / Pause</button>
  <div id="touch">
    <div><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
    <div><button id="touchSpeak">Woof</button><button data-k="jump">Jump</button></div>
  </div>
</div>

<div id="menu" class="overlay on">
  <div class="card">
    <h1>Paws Run</h1>
    <p class="sub" id="menuSub"></p>
    <div class="ward">
      <div class="pv">
        <canvas id="preview" width="170" height="140"></canvas>
        <button class="chip" id="hearBtn">Woof!</button>
      </div>
      <div class="opts">
        <div class="row"><span>I am a</span><div id="oSpecies"></div></div>
        <div class="row"><span>Type</span><div id="oBreed"></div></div>
        <div class="row"><span>Gender</span><div id="oGender"></div></div>
        <div class="row"><span>Fur</span><div id="oFur"></div></div>
        <div class="row"><span>Clothes</span><div id="oClothes"></div></div>
        <div class="row"><span></span><div id="oClothesCol"></div></div>
        <div class="row"><span>Hat</span><div id="oHat"></div></div>
        <div class="row"><span></span><div id="oHatCol"></div></div>
        <div class="row"><span>Audio</span><div id="oAudio"></div></div>
      </div>
    </div>
    <h2>Where to run</h2>
    <canvas id="solar" width="760" height="236" role="img" aria-label="Solar system map. Click a planet or the Moon to run there."></canvas>
    <div class="row" style="margin:8px 0 0"><span style="width:auto">Classic Earth scenes</span><div id="envs"></div></div>
    <p class="help" id="worldInfo" style="margin-top:8px"></p>
    <div id="menuLevels">
      <h2>Round</h2>
      <div class="levels" id="levelBtns"></div>
    </div>
    <div id="pauseBtns" style="display:none">
      <h2>Paused</h2>
      <div class="levels" style="grid-template-columns:1fr 1fr">
        <button class="big" id="resumeBtn">Resume</button>
        <button class="big ghost" id="quitBtn">Quit to menu</button>
      </div>
    </div>
    <p class="help" id="helpText"></p>
  </div>
</div>

<div id="msg" class="overlay">
  <div class="card">
    <h1 id="msgTitle"></h1>
    <p id="msgText"></p>
    <div class="levels"><button class="big" id="msgA"></button><button class="big ghost" id="msgB">Menu</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const T = 36, ROWS = 15, VW = 960, VH = 540, GROUND = 13;
let GRAV = 0.6, JUMP = -12.6, RUN = 4.8;
const PW = 34, PH = 32;
const cv = document.getElementById('game'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- pet options ---------- */
const BREEDS = {
  dog: {
    lab:     { label:'Labrador', leg:9,  bl:22, bh:12, ear:'flop',  tail:'long',  mark:'none' },
    corgi:   { label:'Corgi',    leg:5,  bl:24, bh:12, ear:'big',   tail:'stub',  mark:'chest' },
    husky:   { label:'Husky',    leg:9,  bl:22, bh:12, ear:'point', tail:'curl',  mark:'mask' },
    poodle:  { label:'Poodle',   leg:10, bl:20, bh:11, ear:'pom',   tail:'pom',   mark:'none', fluff:true }
  },
  cat: {
    tabby:   { label:'Tabby',    leg:7,  bl:20, bh:10, ear:'cat',   tail:'cat',   mark:'stripes' },
    siamese: { label:'Siamese',  leg:8,  bl:20, bh:9,  ear:'cat',   tail:'cat',   mark:'points' },
    persian: { label:'Persian',  leg:6,  bl:21, bh:12, ear:'cat',   tail:'bushy', mark:'none', fluff:true },
    tuxedo:  { label:'Tuxedo',   leg:7,  bl:20, bh:10, ear:'cat',   tail:'cat',   mark:'chest' }
  }
};
const FURS = ['#f2e3c6','#e0a45a','#e8873a','#b5651d','#6b4226','#2f2a28','#9aa0a8','#f5f5f5'];
const COLORS = ['#e5484d','#f76b15','#ffc53d','#46a758','#12a594','#3e63dd','#8e4ec6','#e93d82','#f5f5f5','#30343b'];
const CLOTHES = { none:'None', bandana:'Bandana', sweater:'Sweater', cape:'Cape' };
const HATS = { none:'None', cap:'Cap', party:'Party hat', crown:'Crown' };
let pet = { species:'dog', breed:'lab', gender:'girl', fur:'#e0a45a', clothes:'bandana', clothesCol:'#e5484d', hat:'none', hatCol:'#3e63dd' };
let envName = 'grass', worldName = 'earth';
let unlocked = 0;
const isDog = () => pet.species === 'dog';
const treatName = () => isDog() ? 'bone' : 'fish';
const trapName = () => isDog() ? 'fish' : 'bone';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('paws-run') || 'null');
    if (s) { Object.assign(pet, s.pet || {}); if (s.opts) { opts.music = s.opts.music !== false; opts.sound = s.opts.sound !== false; } if (WORLDS[s.world]) worldName = s.world; else if (WORLDS[s.env]) worldName = s.env; unlocked = Math.max(0, Math.min(2, s.unlocked | 0)); }
  } catch (e) {}
  setEnv(0);
  if (!BREEDS[pet.species]) pet.species = 'dog';
  if (!BREEDS[pet.species][pet.breed]) pet.breed = Object.keys(BREEDS[pet.species])[0];
}
function save() { try { localStorage.setItem('paws-run', JSON.stringify({ pet, world: worldName, unlocked, opts })); } catch (e) {} }

/* ---------- environments ---------- */
const THEMES = {
  park:  { label:'Park', sky:['#6dbff0','#d8f3ff'], top:'#5bbf4a', dirt:'#8a5a35', dirt2:'#774a2a', brick:'#d39a55', brickLine:'#a06a30',
           far:'#9fd8a0', near:'#6fbf73', orb:'#fff6c9', spike:'#e8e8ee' },
  beach: { label:'Beach', sky:['#58b7ea','#fde7b0'], top:'#f6dc94', dirt:'#d8ad62', dirt2:'#c99b50', brick:'#c7774a', brickLine:'#96502a',
           far:'#2f9fd0', near:'#f0cf86', orb:'#fff1b8', spike:'#fff7e0' },
  snow:  { label:'Snowy hills', sky:['#8fb8e0','#f0f7fd'], top:'#ffffff', dirt:'#8fa7bd', dirt2:'#7b93aa', brick:'#6c8fb5', brickLine:'#4d6d92',
           far:'#c9dcee', near:'#a9c3dc', orb:'#ffffff', spike:'#d5f0ff' },
  city:  { label:'City at night', sky:['#0b0e2e','#3b2b6e'], top:'#7d8597', dirt:'#3a4257', dirt2:'#323a4e', brick:'#a2574a', brickLine:'#6e342b',
           far:'#1c1f45', near:'#15183a', orb:'#f4f1d0', spike:'#cfd3ff' },
  /* Earth tour */
  grass:   { label:'Earth · Grassland', sky:['#3f9be8','#d6f3ff'], top:'#58c24a', dirt:'#8a5a35', dirt2:'#774a2a', brick:'#d39a55', brickLine:'#a06a30', spike:'#e8e8ee',
             fg:'rgba(24,80,40,.8)', audio:{ song:'park', pitch:1, step:'grass' } },
  ocean:   { label:'Earth · Ocean', sky:['#2f8fe0','#e8fbff'], top:'#f6dc94', dirt:'#d8ad62', dirt2:'#c99b50', brick:'#c7774a', brickLine:'#96502a', spike:'#fff7e0',
             fg:'rgba(196,150,80,.8)', audio:{ song:'beach', pitch:1, step:'sand' } },
  sky:     { label:'Earth · Blue sky', sky:['#1f6fe0','#d8f0ff'], top:'#ffffff', dirt:'#dcefff', dirt2:'#c4e0f7', brick:'#f4b860', brickLine:'#c98a3a', spike:'#e8f6ff',
             fg:'rgba(255,255,255,.85)', fx:['drift','#ffffff',26], audio:{ song:'sky', pitch:1.1, echo:0.12, step:'cloud' } },
  /* Moon and planets: phys = [gravity, jump speed, run speed] */
  moon:    { label:'Moon', sky:['#000005','#12121e'], top:'#c9c9cf', dirt:'#8d8d96', dirt2:'#7b7b85', brick:'#a9adb8', brickLine:'#6f7380', spike:'#e6e6f0',
             fg:'rgba(40,40,48,.9)', phys:[0.099, -12.6, 4.8], audio:{ song:'moon', pitch:0.9, lp:700, echo:0.3, step:'rock' } },
  mercury: { label:'Mercury', sky:['#050203','#5a2a10'], top:'#b59a84', dirt:'#7a6455', dirt2:'#69554a', brick:'#9a7a5c', brickLine:'#5e4633', spike:'#f0d8c0',
             fg:'rgba(40,28,22,.9)', fx:['rise','#ffb060',16], phys:[0.227, -12.6, 4.8], audio:{ song:'mercury', pitch:1, lp:1100, echo:0.15, step:'rock' } },
  venus:   { label:'Venus', sky:['#5a2a0a','#f2c14e'], top:'#e8b04a', dirt:'#a8622a', dirt2:'#8f4f20', brick:'#c7542a', brickLine:'#7a2a12', spike:'#ffe9b0',
             fg:'rgba(70,28,10,.85)', fx:['rise','#ffc060',26], phys:[0.542, -12.6, 4.8], audio:{ song:'venus', pitch:0.78, lp:2600, echo:0.2, step:'rock' } },
  mars:    { label:'Mars', sky:['#b9794e','#f6dcc0'], top:'#d9683a', dirt:'#a8452a', dirt2:'#8f3820', brick:'#c98a5e', brickLine:'#8a5232', spike:'#f2d8c4',
             fg:'rgba(90,32,18,.85)', fx:['drift','#f6d2b0',40], phys:[0.227, -12.6, 4.8], audio:{ song:'mars', pitch:1.18, echo:0.1, step:'rock' } },
  jupiter: { label:'Jupiter', sky:['#c9a27a','#f2e3c8'], top:'#f6e3c2', dirt:'#d9a878', dirt2:'#c48f62', brick:'#b5653a', brickLine:'#7d3f1f', spike:'#fff3dc',
             fg:'rgba(255,240,215,.8)', fx:['streak','#fff0d8',16], phys:[1.518, -18.8, 7], audio:{ song:'jupiter', pitch:0.72, echo:0.25, step:'cloud' } },
  saturn:  { label:'Saturn', sky:['#2a2140','#f2deb0'], top:'#f7ecc8', dirt:'#e0c68a', dirt2:'#cdb074', brick:'#b8925a', brickLine:'#80623a', spike:'#fff6dc',
             fg:'rgba(250,240,205,.8)', fx:['drift','#fff4d6',24], phys:[0.638, -12.6, 4.8], audio:{ song:'saturn', pitch:0.9, echo:0.3, step:'cloud' } },
  uranus:  { label:'Uranus', sky:['#0a4a5e','#c9f7f0'], top:'#e8fffb', dirt:'#7fcfd0', dirt2:'#66b9bd', brick:'#4f9fb0', brickLine:'#2f7385', spike:'#f0ffff',
             fg:'rgba(225,255,250,.8)', fx:['fall','#ffffff',46], phys:[0.532, -12.6, 4.8], audio:{ song:'uranus', pitch:1.25, echo:0.4, step:'ice' } },
  neptune: { label:'Neptune', sky:['#030a2e','#4f8ff0'], top:'#cfe2ff', dirt:'#3f63c9', dirt2:'#3454b0', brick:'#2a3f9a', brickLine:'#182766', spike:'#e0ecff',
             fg:'rgba(16,28,90,.85)', fx:['streak','#cfe2ff',22], phys:[0.684, -12.6, 4.8], audio:{ song:'neptune', pitch:0.85, echo:0.45, step:'ice' } }
};
THEMES.snow.fx = ['fall', '#ffffff', 70]; THEMES.city.fx = ['rise', '#ffe696', 14];
const WORLDS = {
  earth:   { label:'Earth',   levels:['grass', 'ocean', 'sky'], blurb:'Earth — gravity 1× (9.8 m/s²). Easy crosses the grassland, Medium follows the ocean shore, and Hard climbs into the blue sky.' },
  moon:    { label:'Moon',    blurb:'Moon — gravity 0.17× Earth (1.6 m/s²). A full jump goes about six times higher and floats for seconds; tap for a small hop. No air, so sounds are muffled.' },
  mercury: { label:'Mercury', blurb:'Mercury — gravity 0.38× Earth (3.7 m/s²): jumps go about 2.6 times higher. A scorched, cratered rock under a giant Sun.' },
  venus:   { label:'Venus',   blurb:'Venus — gravity 0.90× Earth (8.9 m/s²): jumps are a touch higher. Volcanoes, lightning and a thick orange sky.' },
  mars:    { label:'Mars',    blurb:'Mars — gravity 0.38× Earth (3.7 m/s²): jumps go about 2.6 times higher. Red dunes, mesas and dust devils.' },
  jupiter: { label:'Jupiter', blurb:'Jupiter — gravity 2.53× Earth (24.8 m/s²). You fall fast, so power boots give short, snappy jumps and a quicker run across the cloud tops.' },
  saturn:  { label:'Saturn',  blurb:'Saturn — gravity 1.06× Earth (10.4 m/s²): almost like home. Golden cloud tops beneath the rings.' },
  uranus:  { label:'Uranus',  blurb:'Uranus — gravity 0.89× Earth (8.7 m/s²): jumps are a touch higher. Ice spires and falling diamonds under a tilted ring.' },
  neptune: { label:'Neptune', blurb:'Neptune — gravity 1.14× Earth (11.2 m/s²): jumps are a little lower. Deep blue, racing winds and a dark storm.' },
  park:    { label:'Park',    blurb:'Classic: a sunny park.' },
  beach:   { label:'Beach',   blurb:'Classic: a sandy beach.' },
  snow:    { label:'Snowy hills', blurb:'Classic: snowy hills and pines.' },
  city:    { label:'City at night', blurb:'Classic: rooftops at night.' }
};
for (const k in WORLDS) if (!WORLDS[k].levels) WORLDS[k].levels = [k, k, k];
function setEnv(idx) {
  envName = WORLDS[worldName].levels[idx || 0];
  [GRAV, JUMP, RUN] = THEMES[envName].phys || [0.6, -12.6, 4.8];
  applyVol();
}
const theme = () => THEMES[envName];

/* ---------- sound ---------- */
let AC = null, SFX = null, MUS = null, FILT = null, ESEND = null, MSEND = null, noiseBuf = null;
const opts = { music:true, sound:true };
function applyVol() {
  if (!AC) return;
  const a = theme().audio || {};
  SFX.gain.value = opts.sound ? 1 : 0; MUS.gain.value = opts.music ? 0.6 : 0;
  FILT.frequency.value = a.lp || 20000; ESEND.gain.value = a.echo || 0; MSEND.gain.value = (a.echo || 0) * 0.8;
}
const sp = () => (theme().audio || {}).pitch || 1;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      SFX = AC.createGain(); MUS = AC.createGain(); FILT = AC.createBiquadFilter(); FILT.type = 'lowpass'; FILT.frequency.value = 20000;
      ESEND = AC.createGain(); MSEND = AC.createGain(); const dl = AC.createDelay(1), fb = AC.createGain(); dl.delayTime.value = 0.3; fb.gain.value = 0.38;
      SFX.connect(FILT); FILT.connect(AC.destination); MUS.connect(AC.destination);
      FILT.connect(ESEND); MUS.connect(MSEND); ESEND.connect(dl); MSEND.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.3), AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVol();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function toneAt(t, f0, f1, dur, type, vol, dest) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SFX); o.start(t); o.stop(t + dur + 0.03);
}
function noiseAt(t, dur, freq, vol, type, dest) {
  if (!AC) return;
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  n.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(dest || SFX); n.start(t); n.stop(t + dur + 0.02);
}
const tone = (f0, f1, dur, type, vol, delay = 0) => { if (AC) toneAt(AC.currentTime + delay, f0 * sp(), f1 * sp(), dur, type, vol); };
const noise = (dur, freq, vol, delay = 0) => { if (AC) noiseAt(AC.currentTime + delay, dur, freq, vol); };
const seq = (notes, gap, dur, type, vol) => notes.forEach((f, i) => tone(f, f, dur, type, vol, i * gap));
const sfx = {
  jump() { const p = isDog() ? 1 : 1.35, d = 0.16 * Math.max(0.8, Math.min(2.2, 0.6 / GRAV)); tone(280 * p, 560 * p, d, 'square', 0.1); },
  land() { tone(150, 60, 0.09, 'sine', 0.3); noise(0.05, 400, 0.1); },
  step() { const k = (theme().audio || {}).step; if (k === 'sand') noise(0.05, 420, 0.04); else if (k === 'cloud') noise(0.06, 240, 0.03); else if (k === 'rock') noise(0.02, 2200, 0.05); else if (k === 'ice') tone(2300, 1900, 0.03, 'sine', 0.035); else noise(0.03, isDog() ? 700 : 1500, 0.045); },
  meteor() { const f = 1500 + Math.random() * 1200; if (AC) toneAt(AC.currentTime, f, f * 0.3, 0.5, 'sine', 0.03); },
  shower() { seq([1568, 1319, 1047, 1319, 1568, 2093], 0.09, 0.3, 'sine', 0.06); },
  collect() { tone(988, 988, 0.07, 'square', 0.09); tone(1319, 1319, 0.12, 'square', 0.09, 0.07); },
  stomp() { tone(220, 70, 0.16, 'square', 0.16); noise(0.1, 900, 0.2); },
  hurt() { tone(420, 90, 0.35, 'sawtooth', 0.18); },
  yuck() { tone(300, 140, 0.2, 'sawtooth', 0.18); tone(220, 90, 0.3, 'sawtooth', 0.18, 0.18); },
  check() { seq([523, 659, 784], 0.09, 0.12, 'triangle', 0.2); },
  win() { seq([523, 659, 784, 1047], 0.13, 0.18, 'square', 0.1); tone(1319, 1319, 0.5, 'square', 0.1, 0.52); },

function build(name, w, slimeSpeed, fn) {
  const grid = []; for (let x = 0; x < w; x++) grid.push(new Uint8Array(ROWS));
  const L = { name, w, grid, gems:[], traps:[], slimes:[], bats:[], movers:[], check:0, goal:0 };
  let flip = 1;
  const api = {
    ground(a, b) { for (let x = a; x < b; x++) { grid[x][GROUND] = 1; grid[x][GROUND + 1] = 1; } },
    block(x, y, bw, bh = 1) { for (let i = 0; i < bw; i++) for (let j = 0; j < bh; j++) grid[x + i][y + j] = 2; },
    stairs(x, n) { for (let i = 0; i < n; i++) api.block(x + i, GROUND - 1 - i, 1, i + 1); },
    spikes(a, b) { for (let x = a; x < b; x++) grid[x][GROUND - 1] = 3; },
    gem(x, y) { L.gems.push({ x:(x + .5) * T, y:(y + .5) * T, got:false }); },
    gems(x, y, n) { for (let i = 0; i < n; i++) api.gem(x + i, y); },
    arc(x, y, n) { for (let i = 0; i < n; i++) api.gem(x + i, y - Math.sin((i + .5) / n * Math.PI) * 1.6); },
    trap(x, y) { L.traps.push({ x:(x + .5) * T, y:(y + .5) * T }); },
    slime(a, b) { flip = -flip; L.slimes.push({ x:(a + b) / 2 * T, y:GROUND * T - 22, w:30, h:22, min:a * T, max:b * T - 30, vx:slimeSpeed * flip, alive:true, stun:0 }); },
    bat(a, b, row) { L.bats.push({ x:a * T, y:row * T, base:row * T, w:30, h:18, min:a * T, max:b * T - 30, vx:1.7, t:Math.random() * 6, alive:true, stun:0 }); },
    mover(x1, y1, x2, y2, bw, speed) { L.movers.push({ x:x1 * T, y:y1 * T, w:bw * T, h:14, x1:x1 * T, y1:y1 * T, x2:x2 * T, y2:y2 * T, t:0, speed, dx:0, dy:0 }); },
    check(x) { L.check = x; }, goal(x) { L.goal = x; }
  };
  fn(api);
  return L;
}

/* ---------- state ---------- */
let state = 'menu', levelIdx = 0, L = null, P = null, lives = 3, gemCount = 0, checked = false;
let camX = 0, camY = 0, tick = 0, parts = [], flash = 0, toast = null, happyT = 0;
const keys = { left:false, right:false, jump:false };
let jumpBuf = 0;

function startLevel(i) {
  levelIdx = i; setEnv(i); L = LEVELS[i](); lives = 3; gemCount = 0; checked = false; parts = []; toast = null;
  spawn(); state = 'play'; audio(); mStep = 0;
  $('menu').classList.remove('on'); $('msg').classList.remove('on');
}
function spawn() {
  const sx = checked ? L.check : 2;
  P = { x:sx * T, y:GROUND * T - PH, w:PW, h:PH, vx:0, vy:0, ground:false, face:1, coyote:0, run:0, rider:null, inv:60, squash:0 };
  camX = Math.max(0, Math.min(P.x - VW * 0.4, L.w * T - VW)); camY = 0;
}

const solid = (tx, ty) => tx < 0 || tx >= L.w ? true : (ty < 0 || ty >= ROWS ? false : (L.grid[tx][ty] === 1 || L.grid[tx][ty] === 2));
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx:(Math.random() - .5) * 6, vy:-Math.random() * 5 - 1, life:30 + Math.random() * 15, col });
}

function die(why) {
  if (P.inv > 0) return;
  burst(P.x + P.w / 2, P.y + P.h / 2, pet.fur, 16); flash = 12; lives--;
  if (lives <= 0) sfx.over(); else if (why) sfx.yuck(); else sfx.hurt();
  if (why) toast = { text: why, life: 130 };
  if (lives <= 0) {
    state = 'msg';
    showMsg('Out of hearts', why ? why + ' Round ' + L.name + ' wins this time.' : `Round ${L.name} wins this time.`, 'Try again', () => startLevel(levelIdx));
  } else spawn();
}

function step() {
  tick++;
  if (P.inv > 0) P.inv--;
  if (flash > 0) flash--;
  if (talkT > 0) talkT--;
  if (happyT > 0) happyT--;
  P.squash *= 0.8;
  if (toast && --toast.life <= 0) toast = null;

  for (const m of L.movers) {
    m.t += m.speed;
    const k = (1 - Math.cos(m.t)) / 2;
    const nx = m.x1 + (m.x2 - m.x1) * k, ny = m.y1 + (m.y2 - m.y1) * k;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  if (P.rider) { P.x += P.rider.dx; P.y += P.rider.dy; }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) { P.vx += dir * 0.6; P.face = dir; } else P.vx *= 0.75;
  P.vx = Math.max(-RUN, Math.min(RUN, P.vx));
  if (Math.abs(P.vx) < 0.05) P.vx = 0;
  if (jumpBuf > 0) jumpBuf--;
  if (P.coyote > 0) P.coyote--;
  if (jumpBuf > 0 && P.coyote > 0) { P.vy = JUMP; jumpBuf = 0; P.coyote = 0; P.rider = null; sfx.jump(); P.squash = -0.16; }
  if (!keys.jump && P.vy < -5) P.vy = -5;
  P.vy = Math.min(18, P.vy + GRAV);

  P.x += P.vx;
  {
    const top = Math.floor(P.y / T), bot = Math.floor((P.y + P.h - 1) / T);
    const rx = Math.floor((P.x + P.w - 1) / T), lx = Math.floor(P.x / T);
    for (let ty = top; ty <= bot; ty++) {
      if (solid(rx, ty)) { P.x = rx * T - P.w; P.vx = Math.min(0, P.vx); }
      if (solid(lx, ty)) { P.x = (lx + 1) * T; P.vx = Math.max(0, P.vx); }
    }
  }

  const prevBottom = P.y + P.h, wasGround = P.ground, fallV = P.vy;
  P.y += P.vy;
  P.ground = false;
  {
    const lx = Math.floor(P.x / T), rx = Math.floor((P.x + P.w - 1) / T);
    if (P.vy >= 0) {
      const ty = Math.floor((P.y + P.h) / T);
      for (let tx = lx; tx <= rx; tx++) if (solid(tx, ty) && prevBottom <= ty * T + 0.01) { P.y = ty * T - P.h; P.vy = 0; P.ground = true; }
    } else {
      const ty = Math.floor(P.y / T);
      for (let tx = lx; tx <= rx; tx++) if (solid(tx, ty)) { P.y = (ty + 1) * T; P.vy = 0; }
    }
  }
  P.rider = null;
  if (P.vy >= 0 && !P.ground) {
    for (const m of L.movers) {
      if (P.x + P.w > m.x && P.x < m.x + m.w && prevBottom <= m.y - m.dy + 8 && P.y + P.h >= m.y) {
        P.y = m.y - P.h; P.vy = 0; P.ground = true; P.rider = m; break;
      }
    }
  }
  if (P.ground) P.coyote = 7;
  if (P.ground && !wasGround && fallV > 3) { sfx.land(); P.squash = 0.2; }
  const stride = Math.floor(P.run / Math.PI);
  P.run += Math.abs(P.vx) * 0.09;
  if (P.ground && Math.floor(P.run / Math.PI) !== stride) sfx.step();

  if (P.y > VH + 80) { P.inv = 0; die(); return; }
  {
    const lx = Math.floor(P.x / T), rx = Math.floor((P.x + P.w - 1) / T), ty = GROUND - 1;
    for (let tx = lx; tx <= rx; tx++) {
      if (tx >= 0 && tx < L.w && L.grid[tx][ty] === 3 &&
          hit(P, { x:tx * T + 5, y:ty * T + T * 0.45, w:T - 10, h:T * 0.55 })) { die(); return; }
    }
  }

  for (const s of L.slimes) {
    if (!s.alive) continue;
    if (s.stun > 0) s.stun--; else {
      s.x += s.vx;
      if (s.x < s.min) { s.x = s.min; s.vx = Math.abs(s.vx); }
      if (s.x > s.max) { s.x = s.max; s.vx = -Math.abs(s.vx); }
    }
    if (enemyTouch(s, '#9aa3b5')) return;
  }
  for (const b of L.bats) {
    if (!b.alive) continue;
    if (b.stun > 0) b.stun--; else {
      b.t += 0.07; b.x += b.vx; b.y = b.base + Math.sin(b.t) * 18;
      if (b.x < b.min) { b.x = b.min; b.vx = Math.abs(b.vx); }
      if (b.x > b.max) { b.x = b.max; b.vx = -Math.abs(b.vx); }
    }
    if (enemyTouch(b, '#3b3f52')) return;
  }

  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  for (const g of L.gems) {
    if (!g.got && Math.abs(g.x - cx) < 24 && Math.abs(g.y - cy) < 24) { g.got = true; gemCount++; burst(g.x, g.y, '#ffe27a', 5); sfx.collect(); happyT = 45; }
  }
  if (P.inv === 0) for (const t of L.traps) {
    if (Math.abs(t.x - cx) < 19 && Math.abs(t.y - cy) < 19) {
      die(isDog() ? 'Yuck — fish is for cats!' : 'Yuck — bones are for dogs!'); return;
    }
  }
  if (!checked && P.x > L.check * T) { checked = true; burst(L.check * T + 6, GROUND * T - 60, '#ffd45e', 14); sfx.check(); }
  if (hit(P, { x:L.goal * T + 6, y:-6000, w:T * 1.6, h:6000 + GROUND * T })) finish();

  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
  parts = parts.filter(p => p.life > 0);

  const target = P.x - VW * 0.4;
  camX += (target - camX) * 0.12;
  camX = Math.max(0, Math.min(camX, L.w * T - VW));
  camY += (Math.min(0, P.y - 150) - camY) * 0.14;
}

function enemyTouch(e, col) {
  if (!hit(P, e)) return false;
  if (P.vy > 1 && P.y + P.h - P.vy <= e.y + 12) {
    e.alive = false; P.vy = keys.jump ? JUMP * 0.9 : -8.5; burst(e.x + 15, e.y + 10, col, 12); sfx.stomp();
    return false;
  }
  if (P.inv > 0) return false;

}

function finish() {
  state = 'msg';
  const total = L.gems.length, word = isDog() ? 'Bones' : 'Fish';
  if (levelIdx < 2) sfx.win(); else sfx.finale();
  if (levelIdx < 2) {
    unlocked = Math.max(unlocked, levelIdx + 1); save();
    showMsg(`${L.name} cleared!`, `${word}: ${gemCount} / ${total}. Next up: ${['Medium','Hard'][levelIdx]}.`, 'Next round', () => startLevel(levelIdx + 1));
  } else {
    showMsg('You finished the game!', `Your ${pet.species} made it home through all three rounds. ${word} on Hard: ${gemCount} / ${total}.`, 'Play again', () => startLevel(0));
  }
}

/* ---------- drawing helpers ---------- */
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function dot(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

const drawFood = (g, kind, x, y, s, glow) => kind === 'bone' ? drawBone(g, x, y, s, glow) : drawFish(g, x, y, s, glow);

/* pet: origin at feet centre, facing right. ex = { mood, blink, talk, pant, squash, earBack } */
function drawPet(g, x, y, s, face, run, air, o, ex) {
  ex = ex || {};
  const b = BREEDS[o.species][o.breed], cat = o.species === 'cat';
  const fur = o.fur, dk = shade(fur, 0.58), md = shade(fur, 0.8), lt = tint(fur, 0.32), vlt = tint(fur, 0.62);
  const white = '#fbf7ef', point = '#3a2a22';
  const bob = air ? 0 : Math.abs(Math.sin(run)) * 0.9;
  const top = -(b.leg + b.bh) - bob, hx = b.bl / 2 + 2.5, hy = top - 3.2, hr = cat ? 8 : 8.6;
  const sw = air ? 0.95 : Math.sin(run) * 0.8, wag = Math.sin(tick * 0.3) * 3, sq = ex.squash || 0;
  const pts = b.mark === 'points', socks = b.mark === 'chest' || b.mark === 'mask';
  const mood = ex.mood || 'normal';
  const strokes = (n, col, lw, fn) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); for (let i = 0; i < n; i++) fn(i); g.stroke(); };
  g.save(); g.translate(x, y); g.scale(s * face * (1 + sq), s * (1 - sq)); g.lineCap = 'round'; g.lineJoin = 'round';

  /* cape, behind everything */

    const cx0 = b.bl / 2 - 3, cx1 = -b.bl / 2 - 10;
    g.fillStyle = lin(g, cx0, top, cx1, top + 8, [[0, tint(o.clothesCol, 0.2)], [0.5, o.clothesCol], [1, shade(o.clothesCol, 0.6)]]);
    g.beginPath(); g.moveTo(cx0, top - 1.5); g.quadraticCurveTo(-2, top - 5 + wag * 0.3, cx1, top - 3 + wag * 0.7);
    g.quadraticCurveTo(cx1 + 3, top + 5, cx1 + 2, top + 11 + wag * 0.5); g.quadraticCurveTo(-2, top + 6, cx0 - 3, top + 6); g.closePath(); g.fill();
    g.strokeStyle = shade(o.clothesCol, 0.5); g.lineWidth = 0.6; g.beginPath(); g.moveTo(cx0 - 4, top + 1); g.quadraticCurveTo(-4, top + 1, cx1 + 2, top + 4 + wag * 0.5); g.stroke();
  }

  /* tail */

  const tailStroke = (w, path) => {
    g.strokeStyle = pts ? '#1d1410' : dk; g.lineWidth = w + 1.3; g.beginPath(); path(); g.stroke();
    g.strokeStyle = tcol; g.lineWidth = w; g.beginPath(); path(); g.stroke();
    g.save(); g.translate(0.4, -w * 0.22); g.strokeStyle = pts ? '#5a4438' : lt; g.lineWidth = w * 0.3; g.beginPath(); path(); g.stroke(); g.restore();
  };

  else if (b.tail === 'curl') { tailStroke(5, () => g.arc(tx - 3, ty - 6.5, 5, 0.7, 5.3)); strokes(5, vlt, 0.7, i => { const a = 1.4 + i * 0.8; g.moveTo(tx - 3 + Math.cos(a) * 5, ty - 6.5 + Math.sin(a) * 5); g.lineTo(tx - 3 + Math.cos(a) * 8, ty - 6.5 + Math.sin(a) * 8); }); }
  else if (b.tail === 'stub') { g.fillStyle = dk; dot(g, tx - 1.5, ty - 0.5, 3.9); g.fillStyle = rad(g, tx - 2.5, ty - 2, 0.5, tx - 1.5, ty - 0.5, 3.6, [[0, lt], [1, fur]]); dot(g, tx - 1.5, ty - 0.5, 3.2); }
  else if (b.tail === 'pom') {
    tailStroke(2.4, () => { g.moveTo(tx, ty); g.lineTo(tx - 6, ty - 8 + wag * 0.5); });
    const px = tx - 7.5, py = ty - 10.5 + wag * 0.5;
    g.fillStyle = dk; dot(g, px, py, 5); g.fillStyle = rad(g, px - 1.5, py - 1.5, 0.5, px, py, 4.6, [[0, vlt], [0.6, fur], [1, md]]);
    for (let i = 0; i < 6; i++) dot(g, px + Math.cos(i * 1.05) * 2.2, py + Math.sin(i * 1.05) * 2.2, 2.6);
  } else {

    g.restore();

  g.fillStyle = rad(g, bx + bw * 0.4, top + 1.5, 1, bx + bw * 0.5, top + bh * 0.55, bw * 0.72, [[0, lt], [0.5, fur], [1, dk]]);

  if (b.fluff) {
    for (let i = 0; i < 6; i++) { const px = bx + 2.5 + i * (bw - 5) / 5, py = top + 1 + hash(i) * 1.2; g.fillStyle = dk; dot(g, px, py, 4.1); g.fillStyle = rad(g, px - 1, py - 1.5, 0.5, px, py, 3.8, [[0, vlt], [0.7, fur], [1, md]]); dot(g, px, py, 3.6); }
    for (let i = 0; i < 4; i++) { const px = bx + 4 + i * (bw - 8) / 3, py = top + bh - 0.5; g.fillStyle = md; dot(g, px, py, 3.2); }
    strokes(7, dk, 0.55, i => { const px = bx + 3 + i * (bw - 6) / 6, py = top + 4 + hash(i + 3) * 4; g.moveTo(px, py); g.arc(px - 1, py, 1.1, 0, 2.6); });
  } else {
    strokes(9, md, 0.6, i => { const px = bx + 4 + i * (bw - 7) / 8, py = top + 0.5; g.moveTo(px, py + 1); g.lineTo(px - 1.7 - hash(i) * 0.6, py - 0.7 - hash(i + 7) * 0.6); });
    g.globalAlpha = 0.55; strokes(7, md, 0.5, i => { const px = bx + 4 + hash(i * 3 + 1) * (bw - 8), py = top + 3 + hash(i * 5 + 2) * (bh - 6); g.moveTo(px, py); g.lineTo(px - 1.8, py + 0.5); }); g.globalAlpha = 1;
    g.globalAlpha = 0.7; strokes(5, vlt, 0.5, i => { const px = bx + 5 + hash(i * 7 + 5) * (bw - 10), py = top + 1.8 + hash(i * 2 + 9) * 2.5; g.moveTo(px, py); g.lineTo(px - 1.6, py + 0.3); }); g.globalAlpha = 1;
    strokes(4, socks ? '#e2dccf' : md, 0.7, i => { const px = bx + bw - 3.5 - i * 1.5, py = top + bh - 2.2 + i * 0.3; g.moveTo(px, py); g.lineTo(px - 0.6, py + 2.6); });
  }
  if (b.mark === 'stripes') {
    g.strokeStyle = dk; g.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) { const sx = bx + 4.5 + i * 3.4; g.beginPath(); g.moveTo(sx, top + 0.3); g.quadraticCurveTo(sx - 1.6, top + 3, sx - 0.6, top + 5.8); g.stroke(); }
  }

  /* sweater */
  if (o.clothes === 'sweater') {
    const sx = bx + 3.5, sw2 = bw - 6.5, col = o.clothesCol;
    g.fillStyle = shade(col, 0.55); rr(g, sx - 0.5, top - 1.4, sw2 + 1, bh + 2.4, 4.5);
    g.fillStyle = lin(g, 0, top - 1, 0, top + bh + 1, [[0, tint(col, 0.3)], [0.45, col], [1, shade(col, 0.62)]]); rr(g, sx, top - 0.9, sw2, bh + 1.4, 4);
    g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 0.5; g.beginPath(); for (let i = 1; i < sw2 / 1.7; i++) { g.moveTo(sx + i * 1.7, top - 0.4); g.lineTo(sx + i * 1.7, top + bh); } g.stroke();

  const catEar = (ox, near) => {
    g.save(); g.translate(hx + ox, hy - 5.2); g.rotate(earRot * (near ? 1 : 0.7));
    g.fillStyle = pts ? (near ? point : '#1d1410') : (near ? md : dk);
    g.beginPath(); g.moveTo(-3.6, 1.5); g.quadraticCurveTo(-2.6, -6, -0.4, -9.2); g.quadraticCurveTo(2.8, -5, 3.8, 1.8); g.closePath(); g.fill();

      strokes(3, vlt, 0.5, i => { g.moveTo(-1.6 + i * 0.9, 0.8); g.lineTo(-0.9 + i * 0.8, -2.2 + i * 0.4); }); }

    } else if (b.ear === 'pom') {

      g.fillStyle = dk; ell(g, px, py, 4.6, 6.2); g.fillStyle = near ? rad(g, px - 1.5, py - 2.5, 0.5, px, py, 6, [[0, vlt], [0.6, fur], [1, md]]) : md;
      for (let i = 0; i < 6; i++) dot(g, px + Math.cos(i * 1.05) * 1.7, py + Math.sin(i * 1.05) * 3.2, 2.6);
    } else {
      const big = b.ear === 'big', hgt = big ? 12.5 : 10, wd = big ? 4.6 : 3.6;
      g.save(); g.translate(hx - 3.4 + (near ? 0 : 5.2), hy - 5.6); g.rotate(earRot - (near ? 0.12 : -0.1));
      g.fillStyle = near ? md : dk; g.beginPath(); g.moveTo(-wd, 2); g.quadraticCurveTo(-wd * 0.6, -hgt * 0.6, 0, -hgt); g.quadraticCurveTo(wd * 0.9, -hgt * 0.5, wd, 2.4); g.closePath(); g.fill();

  g.fillStyle = rad(g, hx - 2.6, hy - 3.4, 1, hx, hy, hr * 1.15, [[0, vlt], [0.35, lt], [0.7, fur], [1, md]]); dot(g, hx, hy, hr);

let meteors = [], showerT = 0, nextShower = 420 + Math.random() * 500;
function spawnMeteor() {

}
function meteorTick() {
  if (showerT > 0) { showerT--; if (showerT % 6 === 0) { spawnMeteor(); if (Math.random() < 0.35) sfx.meteor(); } }
  else if (--nextShower <= 0) { showerT = 430; nextShower = 1300 + Math.random() * 1500; if (state === 'play') toast = { text: 'Meteor shower!', life: 160 }; sfx.shower(); }
  else if (Math.random() < 0.0015) spawnMeteor();

  meteors = meteors.filter(m => m.life > 0 && m.y < 400);
}

let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;

  else { acc = 0; tick++; if (talkT > 0) talkT--; if (state === 'menu' || state === 'pause') { drawPreview(); drawSolar(); } }

function chips(id, map, key, after) {
  const box = $(id); box.innerHTML = '';
  Object.entries(map).forEach(([k, label]) => {
    const b = document.createElement('button'); b.className = 'chip' + (pet[key] === k ? ' sel' : ''); b.textContent = label;
    b.onclick = () => { pet[key] = k; if (after) after(); save(); buildMenu(); }; box.appendChild(b);
  });
}
function swatches(id, list, key, hidden) {
  const box = $(id); box.innerHTML = ''; box.parentElement.style.display = hidden ? 'none' : '';
  list.forEach(col => {
    const b = document.createElement('button'); b.className = 'sw' + (pet[key] === col ? ' sel' : ''); b.style.background = col;
    b.setAttribute('aria-label', key + ' ' + col);
    b.onclick = () => { pet[key] = col; save(); buildMenu(); }; box.appendChild(b);
  });
}
function buildMenu() {
  const paused = state === 'pause', dog = isDog();
  chips('oSpecies', { dog:'Dog', cat:'Cat' }, 'species', () => { if (!BREEDS[pet.species][pet.breed]) pet.breed = Object.keys(BREEDS[pet.species])[0]; });
  const bm = {}; Object.entries(BREEDS[pet.species]).forEach(([k, v]) => bm[k] = v.label);
  chips('oBreed', bm, 'breed');
  chips('oGender', { girl:'Girl', boy:'Boy' }, 'gender');
  swatches('oFur', FURS, 'fur');
  chips('oClothes', CLOTHES, 'clothes'); swatches('oClothesCol', COLORS, 'clothesCol', pet.clothes === 'none');
  chips('oHat', HATS, 'hat'); swatches('oHatCol', COLORS, 'hatCol', pet.hat === 'none');
  const au = $('oAudio'); au.innerHTML = '';
  [['music', 'Music'], ['sound', 'Sound effects']].forEach(([k, label]) => {
    const b = document.createElement('button'); b.className = 'chip' + (opts[k] ? ' sel' : ''); b.textContent = `${label}: ${opts[k] ? 'on' : 'off'}`;
    b.onclick = () => { opts[k] = !opts[k]; audio(); applyVol(); save(); buildMenu(); }; au.appendChild(b);
  });
  const ev = $('envs'); ev.innerHTML = '';
  ['park', 'beach', 'snow', 'city'].forEach(k => {
    const b = document.createElement('button'); b.className = 'chip' + (worldName === k ? ' sel' : ''); b.textContent = WORLDS[k].label;
    b.onclick = () => pickWorld(k); ev.appendChild(b);
  });
  $('worldInfo').textContent = WORLDS[worldName].blurb;
  const box = $('levelBtns'); box.innerHTML = '';
  [['Easy', 'Round 1'], ['Medium', 'Round 2'], ['Hard', 'Round 3 · final']].forEach(([n, s], i) => {
    const b = document.createElement('button'); b.className = 'big'; b.disabled = i > unlocked;
    b.innerHTML = `${n}<small>${i > unlocked ? 'Locked — clear ' + ['', 'Easy', 'Medium'][i] : s}</small>`;
    b.onclick = () => startLevel(i); box.appendChild(b);
  });
  const say = dog ? 'Woof' : 'Meow';
  $('hearBtn').textContent = say + '!'; $('touchSpeak').textContent = say;
  $('menuSub').textContent = paused ? 'Change your look or the scenery, then jump back in.'
    : `Run home through three rounds. ${dog ? 'Dogs eat bones — fish will cost you a heart.' : 'Cats eat fish — bones will cost you a heart.'}`;
  $('helpText').innerHTML = `Move: &larr; &rarr; or A / D &nbsp;·&nbsp; Jump: Space, &uarr; or W (hold for higher) &nbsp;·&nbsp; ${say}: B &nbsp;·&nbsp; Pause: P or Esc.<br>` +
    `Collect ${dog ? 'bones' : 'fish'} and never touch ${dog ? 'fish' : 'bones'}. Jump on robot vacuums and crows to knock them out; a ${say.toLowerCase()} startles the ones nearby for a moment. Avoid spikes and pits.`;
}

load(); buildMenu();
requestAnimationFrame(frame);

/* test hook */
window.__game = { LEVELS, startLevel, get P() { return P; }, get L() { return L; }, get state() { return state; }, keys, press, step, speak, pet, drawPet, BREEDS, WORLDS, forceShower() { nextShower = 0; },
  _lives(n) { lives = n; } };
})();
</script>
