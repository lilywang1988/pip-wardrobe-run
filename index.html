<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws Run</title>
<style>
  :root { --ink:#f3efe6; --panel:#1d2233; --panel2:#272d44; --accent:#ffc53d; --line:#3a4160; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#12151f; color:var(--ink);
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas#game { width:100%; height:100%; display:block; background:#000; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .hudBtn { position:absolute; top:2%; padding:.35em .8em; border-radius:999px;
    border:2px solid rgba(255,255,255,.7); background:rgba(0,0,0,.35); font-weight:700; font-size:clamp(11px,1.6vw,15px); }
  #pauseBtn { right:1.5%; }
  #touch { position:absolute; inset:auto 0 3% 0; display:none; justify-content:space-between; padding:0 3%; pointer-events:none; }
  #touch div { display:flex; gap:12px; }
  #touch button { pointer-events:auto; width:64px; height:64px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
    background:rgba(0,0,0,.35); font-size:15px; font-weight:800; user-select:none; -webkit-user-select:none; touch-action:none; }
  @media (pointer:coarse) { #touch { display:flex; } }

  .overlay { position:fixed; inset:0; display:none; overflow:auto; padding:16px; background:rgba(10,12,20,.82); z-index:5; }
  .overlay.on { display:flex; }
  .card { margin:auto; width:min(800px,100%); background:var(--panel); border:2px solid var(--line);
    border-radius:18px; padding:18px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { margin:0 0 2px; font-size:clamp(24px,4.5vw,34px); letter-spacing:.5px; color:var(--accent); }
  .sub { margin:0 0 12px; opacity:.8; font-size:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; margin:12px 0 8px; opacity:.75; }
  .ward { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .pv { flex:none; display:flex; flex-direction:column; gap:8px; }
  #preview { width:170px; height:140px; border-radius:14px; background:var(--panel2); border:2px solid var(--line); }
  .opts { flex:1; min-width:260px; }
  .row { display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
  .row > span { width:58px; font-size:13px; opacity:.85; }
  .row > div { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .sw { width:23px; height:23px; border-radius:50%; border:2px solid rgba(255,255,255,.15); padding:0; }
  .sw.sel { border-color:#fff; box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .chip { padding:.3em .8em; border-radius:999px; border:2px solid var(--line); background:var(--panel2); font-size:13px; }
  .chip.sel { border-color:var(--accent); color:var(--accent); }
  .envs { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .env { height:54px; border-radius:12px; border:3px solid transparent; font-weight:800; font-size:13px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px; text-shadow:0 1px 3px rgba(0,0,0,.7); color:#fff; }
  .env.sel { border-color:var(--accent); }
  .levels { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .big { padding:.7em .5em; border-radius:12px; border:0; background:var(--accent); color:#1b1400; font-weight:800; font-size:16px; }
  .big small { display:block; font-weight:600; font-size:11px; opacity:.75; }
  .big:disabled { background:var(--panel2); color:#8088a5; cursor:not-allowed; }
  .big.ghost { background:var(--panel2); color:var(--ink); border:2px solid var(--line); }
  .help { margin:12px 0 0; font-size:12.5px; opacity:.72; line-height:1.5; }
  #msg .card { width:min(420px,100%); text-align:center; }
  #msg p { margin:6px 0 16px; opacity:.85; }
  #msg .levels { grid-template-columns:1fr 1fr; }
  @media (max-width:520px){ .envs{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <button id="pauseBtn" class="hudBtn">Dress up / Pause</button>
  <div id="touch">
    <div><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
    <div><button id="touchSpeak">Woof</button><button data-k="jump">Jump</button></div>
  </div>
</div>

<div id="menu" class="overlay on">
  <div class="card">
    <h1>Paws Run</h1>
    <p class="sub" id="menuSub"></p>
    <div class="ward">
      <div class="pv">
        <canvas id="preview" width="170" height="140"></canvas>
        <button class="chip" id="hearBtn">Woof!</button>
      </div>
      <div class="opts">
        <div class="row"><span>I am a</span><div id="oSpecies"></div></div>
        <div class="row"><span>Type</span><div id="oBreed"></div></div>
        <div class="row"><span>Gender</span><div id="oGender"></div></div>
        <div class="row"><span>Fur</span><div id="oFur"></div></div>
        <div class="row"><span>Clothes</span><div id="oClothes"></div></div>
        <div class="row"><span></span><div id="oClothesCol"></div></div>
        <div class="row"><span>Hat</span><div id="oHat"></div></div>
        <div class="row"><span></span><div id="oHatCol"></div></div>
        <div class="row"><span>Audio</span><div id="oAudio"></div></div>
      </div>
    </div>
    <h2>Where to run</h2>
    <div class="envs" id="envs"></div>
    <div id="menuLevels">
      <h2>Round</h2>
      <div class="levels" id="levelBtns"></div>
    </div>
    <div id="pauseBtns" style="display:none">
      <h2>Paused</h2>
      <div class="levels" style="grid-template-columns:1fr 1fr">
        <button class="big" id="resumeBtn">Resume</button>
        <button class="big ghost" id="quitBtn">Quit to menu</button>
      </div>
    </div>
    <p class="help" id="helpText"></p>
  </div>
</div>

<div id="msg" class="overlay">
  <div class="card">
    <h1 id="msgTitle"></h1>
    <p id="msgText"></p>
    <div class="levels"><button class="big" id="msgA"></button><button class="big ghost" id="msgB">Menu</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const T = 36, ROWS = 15, VW = 960, VH = 540, GROUND = 13;
const GRAV = 0.6, JUMP = -12.6, RUN = 4.8, PW = 30, PH = 28;
const cv = document.getElementById('game'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- pet options ---------- */
const BREEDS = {
  dog: {
    lab:     { label:'Labrador', leg:9,  bl:22, bh:12, ear:'flop',  tail:'long',  mark:'none' },
    corgi:   { label:'Corgi',    leg:5,  bl:24, bh:12, ear:'big',   tail:'stub',  mark:'chest' },
    husky:   { label:'Husky',    leg:9,  bl:22, bh:12, ear:'point', tail:'curl',  mark:'mask' },
    poodle:  { label:'Poodle',   leg:10, bl:20, bh:11, ear:'pom',   tail:'pom',   mark:'none', fluff:true }
  },
  cat: {
    tabby:   { label:'Tabby',    leg:7,  bl:20, bh:10, ear:'cat',   tail:'cat',   mark:'stripes' },
    siamese: { label:'Siamese',  leg:8,  bl:20, bh:9,  ear:'cat',   tail:'cat',   mark:'points' },
    persian: { label:'Persian',  leg:6,  bl:21, bh:12, ear:'cat',   tail:'bushy', mark:'none', fluff:true },
    tuxedo:  { label:'Tuxedo',   leg:7,  bl:20, bh:10, ear:'cat',   tail:'cat',   mark:'chest' }
  }
};
const FURS = ['#f2e3c6','#e0a45a','#e8873a','#b5651d','#6b4226','#2f2a28','#9aa0a8','#f5f5f5'];
const COLORS = ['#e5484d','#f76b15','#ffc53d','#46a758','#12a594','#3e63dd','#8e4ec6','#e93d82','#f5f5f5','#30343b'];
const CLOTHES = { none:'None', bandana:'Bandana', sweater:'Sweater', cape:'Cape' };
const HATS = { none:'None', cap:'Cap', party:'Party hat', crown:'Crown' };
let pet = { species:'dog', breed:'lab', gender:'girl', fur:'#e0a45a', clothes:'bandana', clothesCol:'#e5484d', hat:'none', hatCol:'#3e63dd' };
let envName = 'park';
let unlocked = 0;
const isDog = () => pet.species === 'dog';
const treatName = () => isDog() ? 'bone' : 'fish';
const trapName = () => isDog() ? 'fish' : 'bone';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('paws-run') || 'null');
    if (s) { Object.assign(pet, s.pet || {}); if (s.opts) { opts.music = s.opts.music !== false; opts.sound = s.opts.sound !== false; } if (THEMES[s.env]) envName = s.env; unlocked = Math.max(0, Math.min(2, s.unlocked | 0)); }
  } catch (e) {}
  if (!BREEDS[pet.species]) pet.species = 'dog';
  if (!BREEDS[pet.species][pet.breed]) pet.breed = Object.keys(BREEDS[pet.species])[0];
}
function save() { try { localStorage.setItem('paws-run', JSON.stringify({ pet, env: envName, unlocked, opts })); } catch (e) {} }

/* ---------- environments ---------- */
const THEMES = {
  park:  { label:'Park', sky:['#6dbff0','#d8f3ff'], top:'#5bbf4a', dirt:'#8a5a35', dirt2:'#774a2a', brick:'#d39a55', brickLine:'#a06a30',
           far:'#9fd8a0', near:'#6fbf73', orb:'#fff6c9', spike:'#e8e8ee' },
  beach: { label:'Beach', sky:['#58b7ea','#fde7b0'], top:'#f6dc94', dirt:'#d8ad62', dirt2:'#c99b50', brick:'#c7774a', brickLine:'#96502a',
           far:'#2f9fd0', near:'#f0cf86', orb:'#fff1b8', spike:'#fff7e0' },
  snow:  { label:'Snowy hills', sky:['#8fb8e0','#f0f7fd'], top:'#ffffff', dirt:'#8fa7bd', dirt2:'#7b93aa', brick:'#6c8fb5', brickLine:'#4d6d92',
           far:'#c9dcee', near:'#a9c3dc', orb:'#ffffff', spike:'#d5f0ff' },
  city:  { label:'City at night', sky:['#0b0e2e','#3b2b6e'], top:'#7d8597', dirt:'#3a4257', dirt2:'#323a4e', brick:'#a2574a', brickLine:'#6e342b',
           far:'#1c1f45', near:'#15183a', orb:'#f4f1d0', spike:'#cfd3ff' }
};
const theme = () => THEMES[envName];

/* ---------- sound ---------- */
let AC = null, SFX = null, MUS = null, noiseBuf = null;
const opts = { music:true, sound:true };
function applyVol() { if (!AC) return; SFX.gain.value = opts.sound ? 1 : 0; MUS.gain.value = opts.music ? 0.6 : 0; }
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      SFX = AC.createGain(); MUS = AC.createGain(); SFX.connect(AC.destination); MUS.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.3), AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVol();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function toneAt(t, f0, f1, dur, type, vol, dest) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SFX); o.start(t); o.stop(t + dur + 0.03);
}
function noiseAt(t, dur, freq, vol, type, dest) {
  if (!AC) return;
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  n.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(dest || SFX); n.start(t); n.stop(t + dur + 0.02);
}
const tone = (f0, f1, dur, type, vol, delay = 0) => { if (AC) toneAt(AC.currentTime + delay, f0, f1, dur, type, vol); };
const noise = (dur, freq, vol, delay = 0) => { if (AC) noiseAt(AC.currentTime + delay, dur, freq, vol); };
const seq = (notes, gap, dur, type, vol) => notes.forEach((f, i) => tone(f, f, dur, type, vol, i * gap));
const sfx = {
  jump() { const p = isDog() ? 1 : 1.35; tone(280 * p, 560 * p, 0.16, 'square', 0.1); },
  land() { tone(150, 60, 0.09, 'sine', 0.3); noise(0.05, 400, 0.1); },
  step() { noise(0.03, isDog() ? 700 : 1500, 0.045); },
  collect() { tone(988, 988, 0.07, 'square', 0.09); tone(1319, 1319, 0.12, 'square', 0.09, 0.07); },
  stomp() { tone(220, 70, 0.16, 'square', 0.16); noise(0.1, 900, 0.2); },
  hurt() { tone(420, 90, 0.35, 'sawtooth', 0.18); },
  yuck() { tone(300, 140, 0.2, 'sawtooth', 0.18); tone(220, 90, 0.3, 'sawtooth', 0.18, 0.18); },
  check() { seq([523, 659, 784], 0.09, 0.12, 'triangle', 0.2); },
  win() { seq([523, 659, 784, 1047], 0.13, 0.18, 'square', 0.1); tone(1319, 1319, 0.5, 'square', 0.1, 0.52); },
  finale() { seq([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.14, 0.22, 'square', 0.1); },
  over() { seq([392, 330, 262, 196], 0.2, 0.25, 'triangle', 0.2); }
};

/* background music: a short looping tune per environment */
const _ = null;
const SONGS = {
  park:  { bpm:132, root:261.63, wave:'square',   chords:[0, 7, 9, 5],
           mel:[4,7,12,7, 4,7,12,_,  2,7,11,7, 2,7,11,_,  0,4,9,4, 0,4,9,12,  0,5,9,5, 7,5,4,2] },
  beach: { bpm:116, root:349.23, wave:'triangle', chords:[0, 7, 9, 5],
           mel:[12,_,9,7, _,9,_,7,  11,_,7,5, _,7,_,2,  9,_,12,9, _,7,_,4,  5,_,9,12, 11,9,7,_] },
  snow:  { bpm:104, root:293.66, wave:'triangle', chords:[0, 7, 9, 5],
           mel:[4,_,7,_, 12,_,7,_,  2,_,7,_, 11,_,7,_,  0,_,4,_, 9,_,4,_,  5,_,9,_, 7,_,2,_] },
  city:  { bpm:124, root:220,    wave:'square',   chords:[0, 8, 3, 10],
           mel:[0,3,7,3, 12,_,7,_,  0,3,8,3, 12,_,8,_,  3,7,10,7, 15,_,10,_,  2,5,10,5, 14,12,10,_] }
};
let mStep = 0, mNext = 0;
function musicTick() {
  if (!AC || !opts.music) return;
  const s = SONGS[envName], dur = 60 / s.bpm / 2;
  if (mNext < AC.currentTime) mNext = AC.currentTime + 0.05;
  while (mNext < AC.currentTime + 0.2) {
    const i = mStep % 32, k = i & 7, ch = s.chords[i >> 3], n = s.mel[i];
    if (n != null) { const f = s.root * Math.pow(2, n / 12); toneAt(mNext, f, f, dur * 0.9, s.wave, s.wave === 'square' ? 0.05 : 0.09, MUS); }
    if (k % 2 === 0) { let b = k % 4 === 0 ? ch : ch + 7; if (b >= 8) b -= 12; const f = s.root / 2 * Math.pow(2, b / 12); toneAt(mNext, f, f, dur * 1.7, 'triangle', 0.16, MUS); }
    if (k % 4 === 0) toneAt(mNext, 120, 45, 0.1, 'sine', 0.22, MUS);
    if (k % 2 === 1) noiseAt(mNext, 0.03, 7000, 0.035, 'highpass', MUS);
    mNext += dur; mStep++;
  }
}
function woof(t0, p) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(330 * p, t0); o.frequency.exponentialRampToValueAtTime(105 * p, t0 + 0.17);
  f.type = 'lowpass'; f.frequency.setValueAtTime(1500, t0); f.frequency.exponentialRampToValueAtTime(450, t0 + 0.17);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  o.connect(f); f.connect(g); g.connect(SFX); o.start(t0); o.stop(t0 + 0.22);
  const n = AC.createBufferSource(), buf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.12), AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const ng = AC.createGain(), nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; ng.gain.value = 0.18;
  n.buffer = buf; n.connect(nf); nf.connect(ng); ng.connect(SFX); n.start(t0);
}
function meow(t0, p) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520 * p, t0); o.frequency.linearRampToValueAtTime(830 * p, t0 + 0.13); o.frequency.linearRampToValueAtTime(470 * p, t0 + 0.42);
  f.type = 'bandpass'; f.Q.value = 2.5;
  f.frequency.setValueAtTime(1300, t0); f.frequency.linearRampToValueAtTime(2500, t0 + 0.15); f.frequency.linearRampToValueAtTime(1100, t0 + 0.42);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.05); g.gain.setValueAtTime(0.5, t0 + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
  lfo.frequency.value = 7; lg.gain.value = 14; lfo.connect(lg); lg.connect(o.frequency);
  o.connect(f); f.connect(g); g.connect(SFX); o.start(t0); o.stop(t0 + 0.47); lfo.start(t0); lfo.stop(t0 + 0.47);
}
let talkT = 0;
function speak() {
  if (talkT > 20) return;
  talkT = 60;
  if (audio()) {
    const p = pet.gender === 'girl' ? 1.2 : 0.88, t = AC.currentTime + 0.01;
    try { if (isDog()) { woof(t, p); woof(t + 0.26, p * 0.96); } else { meow(t, p); meow(t + 0.5, p * 1.05); } } catch (e) {}
  }
  if (state === 'play' && L) {
    for (const e of [...L.slimes, ...L.bats]) if (e.alive && Math.abs(e.x - P.x) < 230 && Math.abs(e.y - P.y) < 160) e.stun = 80;
  }
}

/* ---------- levels ---------- */
function build(name, w, slimeSpeed, fn) {
  const grid = []; for (let x = 0; x < w; x++) grid.push(new Uint8Array(ROWS));
  const L = { name, w, grid, gems:[], traps:[], slimes:[], bats:[], movers:[], check:0, goal:0 };
  let flip = 1;
  const api = {
    ground(a, b) { for (let x = a; x < b; x++) { grid[x][GROUND] = 1; grid[x][GROUND + 1] = 1; } },
    block(x, y, bw, bh = 1) { for (let i = 0; i < bw; i++) for (let j = 0; j < bh; j++) grid[x + i][y + j] = 2; },
    stairs(x, n) { for (let i = 0; i < n; i++) api.block(x + i, GROUND - 1 - i, 1, i + 1); },
    spikes(a, b) { for (let x = a; x < b; x++) grid[x][GROUND - 1] = 3; },
    gem(x, y) { L.gems.push({ x:(x + .5) * T, y:(y + .5) * T, got:false }); },
    gems(x, y, n) { for (let i = 0; i < n; i++) api.gem(x + i, y); },
    arc(x, y, n) { for (let i = 0; i < n; i++) api.gem(x + i, y - Math.sin((i + .5) / n * Math.PI) * 1.6); },
    trap(x, y) { L.traps.push({ x:(x + .5) * T, y:(y + .5) * T }); },
    slime(a, b) { flip = -flip; L.slimes.push({ x:(a + b) / 2 * T, y:GROUND * T - 22, w:30, h:22, min:a * T, max:b * T - 30, vx:slimeSpeed * flip, alive:true, stun:0 }); },
    bat(a, b, row) { L.bats.push({ x:a * T, y:row * T, base:row * T, w:30, h:18, min:a * T, max:b * T - 30, vx:1.7, t:Math.random() * 6, alive:true, stun:0 }); },
    mover(x1, y1, x2, y2, bw, speed) { L.movers.push({ x:x1 * T, y:y1 * T, w:bw * T, h:14, x1:x1 * T, y1:y1 * T, x2:x2 * T, y2:y2 * T, t:0, speed, dx:0, dy:0 }); },
    check(x) { L.check = x; }, goal(x) { L.goal = x; }
  };
  fn(api);
  return L;
}

const LEVELS = [
  () => build('Easy', 110, 1.0, a => {
    a.ground(0, 28); a.ground(30, 58); a.ground(60, 110);
    a.block(10, 10, 3); a.block(16, 8, 3); a.block(36, 10, 4); a.block(44, 8, 3);
    a.block(66, 10, 3); a.block(72, 7, 3); a.block(84, 10, 5);
    a.stairs(96, 4);
    a.gems(10, 9, 3); a.gems(16, 7, 3); a.arc(27, 11, 4); a.gems(36, 9, 4); a.gems(44, 7, 3);
    a.arc(57, 11, 4); a.gems(66, 9, 3); a.gems(72, 6, 3); a.gems(84, 9, 5); a.gems(5, 12, 3); a.gems(100, 12, 3);
    a.trap(22, 12); a.trap(52, 12); a.trap(78, 12); a.trap(86, 7.4);

/* ---------- state ---------- */
let state = 'menu', levelIdx = 0, L = null, P = null, lives = 3, gemCount = 0, checked = false;
let camX = 0, tick = 0, parts = [], flash = 0, toast = null;
const keys = { left:false, right:false, jump:false };
let jumpBuf = 0;

function startLevel(i) {
  levelIdx = i; L = LEVELS[i](); lives = 3; gemCount = 0; checked = false; parts = []; toast = null;
  spawn(); state = 'play'; audio(); mStep = 0;
  $('menu').classList.remove('on'); $('msg').classList.remove('on');
}
function spawn() {
  const sx = checked ? L.check : 2;
  P = { x:sx * T, y:GROUND * T - PH, w:PW, h:PH, vx:0, vy:0, ground:false, face:1, coyote:0, run:0, rider:null, inv:60 };
  camX = Math.max(0, Math.min(P.x - VW * 0.4, L.w * T - VW));
}

const solid = (tx, ty) => tx < 0 || tx >= L.w ? true : (ty < 0 || ty >= ROWS ? false : (L.grid[tx][ty] === 1 || L.grid[tx][ty] === 2));
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx:(Math.random() - .5) * 6, vy:-Math.random() * 5 - 1, life:30 + Math.random() * 15, col });
}

function die(why) {
  if (P.inv > 0) return;
  burst(P.x + P.w / 2, P.y + P.h / 2, pet.fur, 16); flash = 12; lives--;
  if (lives <= 0) sfx.over(); else if (why) sfx.yuck(); else sfx.hurt();
  if (why) toast = { text: why, life: 130 };
  if (lives <= 0) {
    state = 'msg';
    showMsg('Out of hearts', why ? why + ' Round ' + L.name + ' wins this time.' : `Round ${L.name} wins this time.`, 'Try again', () => startLevel(levelIdx));
  } else spawn();
}

function step() {
  tick++;
  if (P.inv > 0) P.inv--;
  if (flash > 0) flash--;
  if (talkT > 0) talkT--;
  if (toast && --toast.life <= 0) toast = null;

  for (const m of L.movers) {
    m.t += m.speed;
    const k = (1 - Math.cos(m.t)) / 2;
    const nx = m.x1 + (m.x2 - m.x1) * k, ny = m.y1 + (m.y2 - m.y1) * k;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  if (P.rider) { P.x += P.rider.dx; P.y += P.rider.dy; }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) { P.vx += dir * 0.6; P.face = dir; } else P.vx *= 0.75;
  P.vx = Math.max(-RUN, Math.min(RUN, P.vx));
  if (Math.abs(P.vx) < 0.05) P.vx = 0;
  if (jumpBuf > 0) jumpBuf--;
  if (P.coyote > 0) P.coyote--;
  if (jumpBuf > 0 && P.coyote > 0) { P.vy = JUMP; jumpBuf = 0; P.coyote = 0; P.rider = null; sfx.jump(); }
  if (!keys.jump && P.vy < -5) P.vy = -5;
  P.vy = Math.min(14, P.vy + GRAV);

  P.x += P.vx;
  {
    const top = Math.floor(P.y / T), bot = Math.floor((P.y + P.h - 1) / T);
    const rx = Math.floor((P.x + P.w - 1) / T), lx = Math.floor(P.x / T);
    for (let ty = top; ty <= bot; ty++) {
      if (solid(rx, ty)) { P.x = rx * T - P.w; P.vx = Math.min(0, P.vx); }
      if (solid(lx, ty)) { P.x = (lx + 1) * T; P.vx = Math.max(0, P.vx); }
    }
  }

  const prevBottom = P.y + P.h, wasGround = P.ground, fallV = P.vy;
  P.y += P.vy;
  P.ground = false;
  {
    const lx = Math.floor(P.x / T), rx = Math.floor((P.x + P.w - 1) / T);
    if (P.vy >= 0) {
      const ty = Math.floor((P.y + P.h) / T);
      for (let tx = lx; tx <= rx; tx++) if (solid(tx, ty) && prevBottom <= ty * T + 0.01) { P.y = ty * T - P.h; P.vy = 0; P.ground = true; }
    } else {
      const ty = Math.floor(P.y / T);
      for (let tx = lx; tx <= rx; tx++) if (solid(tx, ty)) { P.y = (ty + 1) * T; P.vy = 0; }
    }
  }
  P.rider = null;
  if (P.vy >= 0 && !P.ground) {
    for (const m of L.movers) {
      if (P.x + P.w > m.x && P.x < m.x + m.w && prevBottom <= m.y - m.dy + 8 && P.y + P.h >= m.y) {
        P.y = m.y - P.h; P.vy = 0; P.ground = true; P.rider = m; break;
      }
    }
  }
  if (P.ground) P.coyote = 7;
  if (P.ground && !wasGround && fallV > 3) sfx.land();
  const stride = Math.floor(P.run / Math.PI);
  P.run += Math.abs(P.vx) * 0.09;
  if (P.ground && Math.floor(P.run / Math.PI) !== stride) sfx.step();

  if (P.y > VH + 80) { P.inv = 0; die(); return; }
  {
    const lx = Math.floor(P.x / T), rx = Math.floor((P.x + P.w - 1) / T), ty = GROUND - 1;
    for (let tx = lx; tx <= rx; tx++) {
      if (tx >= 0 && tx < L.w && L.grid[tx][ty] === 3 &&
          hit(P, { x:tx * T + 5, y:ty * T + T * 0.45, w:T - 10, h:T * 0.55 })) { die(); return; }
    }
  }

  for (const s of L.slimes) {
    if (!s.alive) continue;
    if (s.stun > 0) s.stun--; else {
      s.x += s.vx;
      if (s.x < s.min) { s.x = s.min; s.vx = Math.abs(s.vx); }
      if (s.x > s.max) { s.x = s.max; s.vx = -Math.abs(s.vx); }
    }
    if (enemyTouch(s, '#9aa3b5')) return;
  }
  for (const b of L.bats) {
    if (!b.alive) continue;
    if (b.stun > 0) b.stun--; else {
      b.t += 0.07; b.x += b.vx; b.y = b.base + Math.sin(b.t) * 18;
      if (b.x < b.min) { b.x = b.min; b.vx = Math.abs(b.vx); }
      if (b.x > b.max) { b.x = b.max; b.vx = -Math.abs(b.vx); }
    }
    if (enemyTouch(b, '#3b3f52')) return;
  }

  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  for (const g of L.gems) {
    if (!g.got && Math.abs(g.x - cx) < 24 && Math.abs(g.y - cy) < 24) { g.got = true; gemCount++; burst(g.x, g.y, '#ffe27a', 5); sfx.collect(); }
  }
  if (P.inv === 0) for (const t of L.traps) {
    if (Math.abs(t.x - cx) < 19 && Math.abs(t.y - cy) < 19) {
      die(isDog() ? 'Yuck — fish is for cats!' : 'Yuck — bones are for dogs!'); return;
    }
  }
  if (!checked && P.x > L.check * T) { checked = true; burst(L.check * T + 6, GROUND * T - 60, '#ffd45e', 14); sfx.check(); }
  if (hit(P, { x:L.goal * T + 6, y:GROUND * T - 60, w:T * 1.6, h:60 })) finish();

  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
  parts = parts.filter(p => p.life > 0);

  const target = P.x - VW * 0.4;
  camX += (target - camX) * 0.12;
  camX = Math.max(0, Math.min(camX, L.w * T - VW));
}

function enemyTouch(e, col) {
  if (!hit(P, e)) return false;
  if (P.vy > 1 && P.y + P.h - P.vy <= e.y + 12) {
    e.alive = false; P.vy = keys.jump ? JUMP * 0.9 : -8.5; burst(e.x + 15, e.y + 10, col, 12); sfx.stomp();
    return false;
  }
  if (P.inv > 0) return false;
  die(); return true;
}

function finish() {
  state = 'msg';
  const total = L.gems.length, word = isDog() ? 'Bones' : 'Fish';
  if (levelIdx < 2) sfx.win(); else sfx.finale();
  if (levelIdx < 2) {
    unlocked = Math.max(unlocked, levelIdx + 1); save();
    showMsg(`${L.name} cleared!`, `${word}: ${gemCount} / ${total}. Next up: ${['Medium','Hard'][levelIdx]}.`, 'Next round', () => startLevel(levelIdx + 1));
  } else {
    showMsg('You finished the game!', `Your ${pet.species} made it home through all three rounds. ${word} on Hard: ${gemCount} / ${total}.`, 'Play again', () => startLevel(0));
  }
}

/* ---------- drawing helpers ---------- */
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, f) { const [r, g, b] = rgb(hex); const k = v => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${k(r)},${k(g)},${k(b)})`; }
function tint(hex, f) { const [r, g, b] = rgb(hex); const k = v => Math.round(v + (255 - v) * f); return `rgb(${k(r)},${k(g)},${k(b)})`; }

function dot(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function tri(g, x1, y1, x2, y2, x3, y3) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); g.fill(); }

function drawBone(g, x, y, s) {
  g.save(); g.translate(x, y); g.rotate(-0.5); g.scale(s, s);
  g.fillStyle = '#fff8e8'; g.strokeStyle = '#b9a98a'; g.lineWidth = 1.2;
  g.beginPath(); g.roundRect(-7, -2.5, 14, 5, 2); g.fill(); g.stroke();
  for (const [dx, dy] of [[-8, -3], [-8, 3], [8, -3], [8, 3]]) { g.beginPath(); g.arc(dx, dy, 3.6, 0, 7); g.fill(); g.stroke(); }
  g.fillRect(-7, -1.6, 14, 3.2);
  g.restore();
}
function drawFish(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#4fb6e8'; g.strokeStyle = '#256f9a'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-7, 0); g.lineTo(-13, -6); g.lineTo(-13, 6); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(0, 0, 9, 5.5, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#bfe6fa'; g.beginPath(); g.ellipse(0, 2, 6, 2.5, 0, 0, 7); g.fill();
  g.fillStyle = '#fff'; dot(g, 4.5, -1.5, 2); g.fillStyle = '#123'; dot(g, 5, -1.5, 1);
  g.restore();
}
const drawFood = (g, kind, x, y, s) => kind === 'bone' ? drawBone(g, x, y, s) : drawFish(g, x, y, s);

/* pet: origin at feet centre, facing right */
function drawPet(g, x, y, s, face, run, air, o, talking) {
  const b = BREEDS[o.species][o.breed], cat = o.species === 'cat';
  const fur = o.fur, dark = shade(fur, 0.72), light = tint(fur, 0.45), white = '#fbf7ef', point = '#3a2a22';
  const top = -(b.leg + b.bh), hx = b.bl / 2 + 2, hy = top - 2, hr = cat ? 7.5 : 8;
  const sw = air ? 0.9 : Math.sin(run) * 0.75, wag = Math.sin(tick * 0.3) * 3;
  const paw = b.mark === 'points' ? point : (b.mark === 'chest' || b.mark === 'mask') ? white : null;
  g.save(); g.translate(x, y); g.scale(s * face, s); g.lineCap = 'round'; g.lineJoin = 'round';

    g.fillStyle = o.clothesCol;
    g.beginPath(); g.moveTo(b.bl / 2 - 3, top - 1); g.lineTo(-b.bl / 2 - 9, top - 3 + wag * 0.6); g.lineTo(-b.bl / 2 - 6, top + 9 + wag * 0.4); g.lineTo(b.bl / 2 - 6, top + 5); g.closePath(); g.fill();

  else { g.lineWidth = b.tail === 'bushy' ? 7.5 : 3.5; g.beginPath(); g.moveTo(tx, ty); g.bezierCurveTo(tx - 10, ty + 2, tx - 12, ty - 8, tx - 7 + wag * 0.5, ty - 16); g.stroke(); }

    g.fillStyle = col; rr(g, -2.3, 0, 4.6, b.leg + 1, 2.2);
    if (paw) { g.fillStyle = paw; rr(g, -2.3, b.leg - 2.5, 4.6, 3.5, 1.8); }

  if (b.mark === 'stripes') { g.strokeStyle = dark; g.lineWidth = 1.6; for (let i = 0; i < 4; i++) { const sx = -b.bl / 2 + 5 + i * 3.6; g.beginPath(); g.moveTo(sx, top + 0.5); g.lineTo(sx - 1, top + 5); g.stroke(); } }

  if (o.clothes === 'sweater') {
    g.fillStyle = o.clothesCol; rr(g, -b.bl / 2 + 4, top - 0.8, b.bl - 7, b.bh + 1.2, 4);
    g.fillStyle = tint(o.clothesCol, 0.45); g.fillRect(-b.bl / 2 + 4, top + b.bh / 2 - 1.2, b.bl - 7, 2.4);
    g.fillStyle = shade(o.clothesCol, 0.8); rr(g, b.bl / 2 - 5.5, top - 1.5, 3.5, b.bh + 2.4, 1.5);

    tri(g, hx - 6, hy - 4, hx - 4, hy - 13.5, hx + 0.5, hy - 6.5); tri(g, hx + 0.5, hy - 7, hx + 4.5, hy - 13.5, hx + 6.5, hy - 3.5);

    g.fillStyle = '#e88aa0'; tri(g, hx + 6.6, hy + 0.6, hx + 8.6, hy + 0.6, hx + 7.6, hy + 2.2);

    g.fillStyle = b.mark === 'points' ? '#58b8f0' : '#8fd14f'; g.beginPath(); g.ellipse(hx + 3, hy - 1.8, 2, 2.3, 0, 0, 7); g.fill();

/* ---------- loop ---------- */
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
  if (state === 'play') { acc += dt; while (acc >= 1 / 60 && state === 'play') { step(); acc -= 1 / 60; } if (state === 'play') musicTick(); }
  else { acc = 0; tick++; if (talkT > 0) talkT--; if (state === 'menu' || state === 'pause') drawPreview(); }
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump' };
function press(k, down) { if (down) audio(); if (k === 'jump' && down && !keys.jump) jumpBuf = 8; keys[k] = down; }
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); e.preventDefault(); return; }
  if ((e.code === 'KeyB' || e.code === 'KeyM' || e.code === 'KeyX') && !e.repeat) { speak(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  if (state === 'play') e.preventDefault();
  if (!e.repeat) press(k, true);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
document.querySelectorAll('#touch button[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(k, true); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => press(k, false));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('touchSpeak').addEventListener('pointerdown', e => { e.preventDefault(); speak(); });
$('hearBtn').onclick = speak;

}

$('msgB').onclick = toMenu; $('quitBtn').onclick = toMenu;

  });
  const say = dog ? 'Woof' : 'Meow';
  $('hearBtn').textContent = say + '!'; $('touchSpeak').textContent = say;
  $('menuSub').textContent = paused ? 'Change your look or the scenery, then jump back in.'
    : `Run home through three rounds. ${dog ? 'Dogs eat bones — fish will cost you a heart.' : 'Cats eat fish — bones will cost you a heart.'}`;
  $('helpText').innerHTML = `Move: &larr; &rarr; or A / D &nbsp;·&nbsp; Jump: Space, &uarr; or W (hold for higher) &nbsp;·&nbsp; ${say}: B &nbsp;·&nbsp; Pause: P or Esc.<br>` +
    `Collect ${dog ? 'bones' : 'fish'} and never touch ${dog ? 'fish' : 'bones'}. Jump on robot vacuums and crows to knock them out; a ${say.toLowerCase()} startles the ones nearby for a moment. Avoid spikes and pits.`;
}

load(); buildMenu();
requestAnimationFrame(frame);

/* test hook */
window.__game = { LEVELS, startLevel, get P() { return P; }, get L() { return L; }, get state() { return state; }, keys, press, step, speak, pet,
  _lives(n) { lives = n; } };
})();
</script>
</body>
</html>
